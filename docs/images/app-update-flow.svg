<rect x="110" y="40" width="960" height="172" rx="14" fill="#171D26" stroke="#59B8FF" stroke-width="2.2"/>
<text x="130" y="76" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#59B8FF" text-anchor="start">Trigger</text>
<text x="130" y="107" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#93A0B1" text-anchor="start"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">ClipForegroundService</tspan> calls <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">schedule()</tspan> → <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">AppUpdater</tspan></text>
<text x="130" y="134" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#93A0B1" text-anchor="start">(or the JS <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">checkAppUpdate</tspan>, or an app launch)</text>
<text x="130" y="161" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#93A0B1" text-anchor="start">First check ~60 s after start, then every 6 h.</text>
<text x="130" y="188" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#93A0B1" text-anchor="start">One retry after 15 min if the probe failed.</text>
<rect x="110" y="262" width="960" height="91" rx="14" fill="#171D26" stroke="#313B49" stroke-width="1.8"/>
<text x="130" y="298" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#E8EEF5" text-anchor="start">Check</text>
<text x="130" y="329" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#93A0B1" text-anchor="start"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">GET releases/latest</tspan>: newer than the installed <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">versionName</tspan>?</text>
<rect x="110" y="403" width="960" height="118" rx="14" fill="#171D26" stroke="#313B49" stroke-width="1.8"/>
<text x="130" y="439" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#E8EEF5" text-anchor="start">Download</text>
<text x="130" y="470" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#93A0B1" text-anchor="start">To <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">cacheDir/updates/&lt;v&gt;.apk.part</tspan></text>
<text x="130" y="497" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#93A0B1" text-anchor="start">(OkHttp, Range-resumed, progress → <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">onAppUpdate</tspan>)</text>
<rect x="110" y="571" width="960" height="202" rx="14" fill="#171D26" stroke="#313B49" stroke-width="1.8"/>
<text x="130" y="607" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#E8EEF5" text-anchor="start">Verify</text>
<text x="130" y="638" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#93A0B1" text-anchor="start">Rename the finished file, then check all of:</text>
<rect x="132" y="659" width="270" height="40" rx="20" fill="#171D26" stroke="#313B49" stroke-width="1.6"/>
<text x="267" y="684.775" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#E8EEF5" text-anchor="middle">SHA-256 (asset <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">digest</tspan>)</text>
<rect x="416" y="659" width="170" height="40" rx="20" fill="#171D26" stroke="#313B49" stroke-width="1.6"/>
<text x="501" y="684.775" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#E8EEF5" text-anchor="middle">same package</text>
<rect x="600" y="659" width="250" height="40" rx="20" fill="#171D26" stroke="#313B49" stroke-width="1.6"/>
<text x="725" y="684.775" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#E8EEF5" text-anchor="middle">higher <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">versionCode</tspan></text>
<rect x="132" y="711" width="520" height="40" rx="20" fill="#171D26" stroke="#313B49" stroke-width="1.6"/>
<text x="392" y="736.775" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#E8EEF5" text-anchor="middle">signing certificate shared with the installed app</text>
<rect x="110" y="823" width="960" height="118" rx="14" fill="#171D26" stroke="#3DDC97" stroke-width="2.2"/>
<text x="130" y="859" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#3DDC97" text-anchor="start">Ready</text>
<text x="130" y="890" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#93A0B1" text-anchor="start"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">UpdateNotifier</tspan>: “Update ready, tap to install”</text>
<text x="130" y="917" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#93A0B1" text-anchor="start">(or the sheet’s Install button)</text>
<rect x="110" y="991" width="960" height="200" rx="14" fill="#171D26" stroke="#313B49" stroke-width="1.8"/>
<text x="130" y="1027" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#E8EEF5" text-anchor="start">Install</text>
<rect x="132" y="1053" width="190" height="40" rx="20" fill="#171D26" stroke="#313B49" stroke-width="1.6"/>
<text x="227" y="1078.775" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#E8EEF5" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">InstallActivity</tspan></text>
