<rect x="150" y="40" width="1040" height="110" rx="12" fill="#171D26" stroke="#59B8FF" stroke-width="1.8"/>
<text x="170" y="71" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#59B8FF" text-anchor="start">Trigger</text>
<text x="170" y="98" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#93A0B1" text-anchor="start"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">ClipForegroundService</tspan> calls <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">schedule()</tspan> (or the JS <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">checkAppUpdate</tspan>, or an app launch) → <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">AppUpdater</tspan></text>
<text x="170" y="121" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#93A0B1" text-anchor="start">First check about 60 s after start, then every 6 h. One retry after 15 min if the probe failed.</text>
<rect x="150" y="195" width="1040" height="80" rx="12" fill="#171D26" stroke="#313B49" stroke-width="1.5"/>
<text x="170" y="226" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#E8EEF5" text-anchor="start">Check</text>
<text x="170" y="253" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#93A0B1" text-anchor="start"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">GET releases/latest</tspan>: is it newer than the installed <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">versionName</tspan>?</text>
<rect x="150" y="320" width="1040" height="80" rx="12" fill="#171D26" stroke="#313B49" stroke-width="1.5"/>
<text x="170" y="351" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#E8EEF5" text-anchor="start">Download</text>
<text x="170" y="378" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#93A0B1" text-anchor="start">To <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">cacheDir/updates/&lt;v&gt;.apk.part</tspan> (OkHttp, Range-resumed, progress → <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">onAppUpdate</tspan>)</text>
<rect x="150" y="445" width="1040" height="135" rx="12" fill="#171D26" stroke="#313B49" stroke-width="1.5"/>
<text x="170" y="476" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#E8EEF5" text-anchor="start">Verify</text>
<text x="170" y="503" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#93A0B1" text-anchor="start">Rename the finished file, then check all of:</text>
<rect x="170" y="525" width="215" height="38" rx="19" fill="#171D26" stroke="#313B49" stroke-width="1.4"/>
<text x="277.5" y="548.9" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E8EEF5" text-anchor="middle">SHA-256 (asset <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">digest</tspan>)</text>
<rect x="399" y="525" width="140" height="38" rx="19" fill="#171D26" stroke="#313B49" stroke-width="1.4"/>
<text x="469" y="548.9" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E8EEF5" text-anchor="middle">same package</text>
<rect x="553" y="525" width="175" height="38" rx="19" fill="#171D26" stroke="#313B49" stroke-width="1.4"/>
<text x="640.5" y="548.9" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E8EEF5" text-anchor="middle">higher <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">versionCode</tspan></text>
<rect x="742" y="525" width="400" height="38" rx="19" fill="#171D26" stroke="#313B49" stroke-width="1.4"/>
<text x="942" y="548.9" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E8EEF5" text-anchor="middle">signing certificate shared with the installed app</text>
<rect x="150" y="625" width="1040" height="80" rx="12" fill="#171D26" stroke="#3DDC97" stroke-width="1.8"/>
<text x="170" y="656" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#3DDC97" text-anchor="start">Ready</text>
<text x="170" y="683" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#93A0B1" text-anchor="start"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">UpdateNotifier</tspan>: “Update ready, tap to install” (or the sheet’s Install button)</text>
<rect x="150" y="750" width="1040" height="120" rx="12" fill="#171D26" stroke="#313B49" stroke-width="1.5"/>
<text x="170" y="781" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#E8EEF5" text-anchor="start">Install</text>
<rect x="170" y="808" width="200" height="38" rx="19" fill="#171D26" stroke="#313B49" stroke-width="1.4"/>
<text x="270" y="831.9" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E8EEF5" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">InstallActivity</tspan></text>
