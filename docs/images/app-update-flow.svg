<path d="M558 1095 L558 1103.5 Q558 1112 549.5 1112 L290.5 1112 Q282 1112 282 1120.5 L282 1129" fill="none" stroke="#7B8899" stroke-width="2.2" stroke-linecap="round" marker-end="url(#m0)"/>
<rect x="132" y="1131" width="300" height="40" rx="20" fill="#171D26" stroke="#313B49" stroke-width="1.6"/>
<text x="282" y="1156.775" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#E8EEF5" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">PackageInstaller</tspan> session</text>
<path d="M436 1151 L474 1151" fill="none" stroke="#7B8899" stroke-width="2.2" stroke-linecap="round" marker-end="url(#m0)"/>
<rect x="478" y="1131" width="270" height="40" rx="20" fill="#171D26" stroke="#313B49" stroke-width="1.6"/>
<text x="613" y="1156.775" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#E8EEF5" text-anchor="middle">system “Update” screen</text>
<rect x="110" y="1241" width="960" height="118" rx="14" fill="#171D26" stroke="#F2B84B" stroke-width="2.2"/>
<text x="130" y="1277" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#F2B84B" text-anchor="start">The OS replaces the app</text>
<text x="130" y="1308" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#93A0B1" text-anchor="start"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">PackageReplacedReceiver</tspan>: <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">reset()</tspan> the record and files,</text>
<text x="130" y="1335" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="400" fill="#93A0B1" text-anchor="start">then restarts <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">ClipForegroundService</tspan>.</text>
