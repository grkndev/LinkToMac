<path d="M700 827 L718 827" fill="none" stroke="#7B8899" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<rect x="722" y="808" width="235" height="38" rx="19" fill="#171D26" stroke="#313B49" stroke-width="1.4"/>
<text x="839.5" y="831.9" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E8EEF5" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">PackageInstaller</tspan> session</text>
<path d="M961 827 L979 827" fill="none" stroke="#7B8899" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<rect x="983" y="808" width="190" height="38" rx="19" fill="#171D26" stroke="#313B49" stroke-width="1.4"/>
<text x="1078" y="831.9" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E8EEF5" text-anchor="middle">system “Update” screen</text>
<rect x="150" y="915" width="1040" height="70" rx="12" fill="#171D26" stroke="#F2B84B" stroke-width="1.8"/>
<text x="170" y="946" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#F2B84B" text-anchor="start">The OS replaces the app</text>
<text x="170" y="971" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#93A0B1" text-anchor="start"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">PackageReplacedReceiver</tspan>: <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">reset()</tspan> the record and files, then restart <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="0.93em" fill="#9CCBFF">ClipForegroundService</tspan>.</text>
