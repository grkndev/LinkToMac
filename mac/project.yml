# XcodeGen spec. Generate the project with:  xcodegen generate
# The resulting LinkToMac.xcodeproj is reproducible from this file and is gitignored.
name: LinkToMac
options:
  bundleIdPrefix: dev.grkn
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    # Ad-hoc signing so the app builds/runs locally without a Developer team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
targets:
  LinkToMac:
    type: application
    platform: macOS
    # Relay host/port/token come from Config.xcconfig, which optionally includes the
    # gitignored Secrets.xcconfig (real values). Keeps secrets out of tracked source.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: Sparkle
    sources:
      - path: Sources
      - path: Resources/AppIcon.icon
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.grkn.LinkToMac
        PRODUCT_NAME: LinkToMac
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  LinkToMac:
    build:
      targets:
        LinkToMac: all
    run:
      config: Debug
    archive:
      config: Release
