# XcodeGen spec. Generate the project with:  xcodegen generate
# The resulting LinkToMac.xcodeproj is reproducible from this file and is gitignored.
name: LinkToMac
options:
  bundleIdPrefix: dev.grkn
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.13.0"
    CURRENT_PROJECT_VERSION: "18"
    # Ad-hoc signing so Debug/local builds need no Developer team. Release builds are NOT shipped
    # from this: scripts/build-release.sh re-signs every bundle with Developer ID + hardened runtime
    # and notarizes it (entitlements: Resources/LinkToMac.entitlements).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
targets:
  LinkToMac:
    type: application
    platform: macOS
    # Relay host/port/token come from Config.xcconfig, which optionally includes the
    # gitignored Secrets.xcconfig (real values). Keeps secrets out of tracked source.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: Sparkle
      # Embedded into Contents/PlugIns so Finder's Share menu can find it. The release script signs
      # it explicitly, with its own entitlements, before signing the app around it.
      - target: LinkToMacShareExtension
        embed: true
    sources:
      - path: Sources
      - path: Resources/AppIcon.icon
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.grkn.LinkToMac
        PRODUCT_NAME: LinkToMac
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Finder ▸ Share ▸ "Send to Phone". Sandboxed by definition (every app extension is), so it
  # can't send anything itself — it hands the file path to the app over the linktomac:// scheme.
  LinkToMacShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
      # The writing half of the hand-off; the app compiles the same file for the reading half.
      - path: Sources/LinkToMac/ShareHandoff.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.grkn.LinkToMac.ShareExtension
        PRODUCT_NAME: SendToPhone
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        # Mandatory: macOS won't register an unsandboxed app extension at all.
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements

  # Pure-logic tests (frame codec, ack window, sender, folder planner, inbox). No host app: the
  # files under test are compiled straight into the bundle, so running them never launches the
  # menu-bar agent or dials a relay. Only Foundation/AppKit-free-ish sources belong here.
  LinkToMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/LinkToMac/RelayProtocol.swift
      - path: Sources/LinkToMac/FileTransfer.swift
      - path: Sources/LinkToMac/FileDrop.swift
      - path: Sources/LinkToMac/FileHistory.swift
      - path: Sources/LinkToMac/ShareHandoff.swift
      - path: Sources/LinkToMac/DropStaging.swift
      - path: Sources/LinkToMac/NowPlaying.swift
      # E2E envelope (ChaCha20-Poly1305, v2): CommandFrame seals Mac -> phone `cmd` frames with it. Foundation + CryptoKit only.
      - path: Sources/LinkToMac/ClipCodec.swift
      # QUIC server identity (stage 0.2 of docs/plans/2026-11-14-quic-data-plane.md): Foundation / Security /
      # CryptoKit only. The Keychain tests use their own throwaway labels and clean up after themselves.
      - path: Sources/LinkToMac/Quic/DERWriter.swift
      - path: Sources/LinkToMac/Quic/QuicIdentity.swift
      # Delay-driven file-rate controller (stage 0.7 / Faz 6.1): pure Foundation, tested against a simulated bottleneck.
      - path: Sources/LinkToMac/Quic/DelayRateController.swift
      # The q.* control actions that open and close a QUIC session (stage 1.3), plus the pure handshake rules. Foundation only.
      - path: Sources/LinkToMac/Quic/QuicControl.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.grkn.LinkToMacTests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  LinkToMac:
    build:
      targets:
        LinkToMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LinkToMacTests
    archive:
      config: Release
