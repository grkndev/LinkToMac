[package]
name = "quic-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Link To Mac QUIC data-plane core for the Android selfadb module (JNI)."

[lib]
name = "quic_core"
# cdylib -> libquic_core.so (loaded by QuicCore.kt); rlib -> `cargo test` on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
# ring, NOT aws-lc-rs: aws-lc-sys needs cmake/NASM on the NDK toolchain.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }
jni = "0.21"
bytes = "1"
# Used from stage 1.7 on (fingerprint pinning); declared now so the toolchain is proven with the final dependency set.
sha2 = "0.10"
subtle = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# unwind (not abort): every JNI entry point wraps its body in catch_unwind, so a Rust panic
# becomes an error string instead of killing the whole app process.
panic = "unwind"

[dev-dependencies]
rustls-webpki = { version = "0.103.17", default-features = false, features = ["ring", "std"] }
x509-parser = { version = "0.18.1", features = ["verify"] }
# Reads the shared protocol vectors (tests/vectors.rs). Dev only: never part of the Android .so.
serde_json = "1"
# A throwaway self-signed certificate for the in-process loopback server of tests/client.rs. Dev only.
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
