apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'expo.modules.selfadb'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "expo.modules.selfadb"
  compileSdk 35

  defaultConfig {
    // 30 is the real floor: wireless ADB pairing (the whole self-ADB pipeline) needs
    // Android 11, and ClipCodec's ChaCha20-Poly1305 JCA cipher needs API 28+ anyway.
    // Declaring lower just ships an install that can never work (crypto fails closed).
    minSdk 30
    targetSdk 34
  }

  lintOptions {
    abortOnError false
  }

  testOptions {
    unitTests {
      // android.jar is a stub in JVM tests; unmocked calls (Log, Environment…) return defaults
      // instead of throwing, so pure logic that merely touches them can still be tested.
      returnDefaultValues = true
      all {
        // The wire vectors shared with the Mac codec live at the repo root (4 levels up from here).
        systemProperty "vectors.dir", project.file("../../../../protocol-vectors").canonicalPath
      }
    }
  }
}

// QUIC core (Rust, mobile/native-src/quic-core). libquic_core.so is NOT committed: build-so.sh produces it
// into src/main/jniLibs/arm64-v8a. A build without it must still work (a dev client without Rust installed,
// an x86_64 emulator): QuicCore.kt then reports "unavailable". So this only WARNS, it never fails the build,
// but a release must be cut after running build-so.sh or QUIC is silently absent from that APK.
def quicCoreSo = file("src/main/jniLibs/arm64-v8a/libquic_core.so")
tasks.register("checkQuicCoreSo") {
  doLast {
    if (!quicCoreSo.exists()) {
      logger.warn("[quic-core] libquic_core.so is missing: this build ships WITHOUT QUIC. " +
                  "Run mobile/native-src/quic-core/build-so.sh before cutting a release.")
    }
  }
}
tasks.matching { it.name == "preBuild" }.configureEach { dependsOn("checkQuicCoreSo") }

dependencies {
  // ===================================================================
  // libadb-android — pure-Java adb client with Android 11+ TLS + spake2
  // pairing (this is what makes self-ADB possible on Android 14).
  // Published on JitPack (NOT Maven Central) under the com.github.* group.
  //   https://github.com/MuntashirAkon/libadb-android
  // JitPack repo is already on the search path (expo adds it); if a clean
  // checkout can't resolve it, add to android/build.gradle allprojects:
  //   maven { url "https://jitpack.io" }
  // ===================================================================
  implementation "com.github.MuntashirAkon:libadb-android:3.1.1"
  // libadb-android already pulls bcprov-jdk15to18:1.81 transitively (it uses BC
  // for spake2/pairing). Add ONLY the matching bcpkix (cert builder) in the same
  // variant+version so there are no duplicate org.bouncycastle.* classes.
  implementation "org.bouncycastle:bcpkix-jdk15to18:1.81"
  // TLS provider required for adb-over-TLS (Android 11+)
  implementation "org.conscrypt:conscrypt-android:2.5.3"
  // WebSocket client for the relay (runs in the foreground service). React Native already
  // bundles OkHttp 4.12 on the classpath; pin the same version to avoid conflicts.
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  // androidx.core.content.FileProvider for the clipboard-image content URIs (declared in the
  // module manifest). Every RN app already ships androidx.core; this just makes the compile
  // dependency explicit.
  implementation "androidx.core:core:1.13.1"

  // JVM unit tests (`./gradlew :selfadb:testDebugUnitTest`). org.json is a real library here
  // because the android.jar copy is a stub that throws on use — FileFrame needs it.
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20240303"
}
